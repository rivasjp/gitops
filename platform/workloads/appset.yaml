# Every workload, from one ApplicationSet. Same shape as the addons appset.
#
# The matrix fans out over platform/workloads/*/config.yaml. Each config declares
# the label that gates it, so the cluster generator's selector is templated per
# addon — which requires ArgoCD 3.x. On 2.x selector keys are passed through
# literally and silently generate nothing, which is why AWS's eks-blueprints
# ships one ApplicationSet per addon instead.
#
# The gating label comes from config.yaml rather than the directory name, so
# renaming a directory cannot silently detach an addon from its label.
#
# Adding an addon: a directory with config.yaml, optionally values.yaml, and the
# matching enable_* label in Terraform. This file never changes.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    # Deleting this must not take every addon and its CRDs with it.
    preserveResourcesOnDeletion: false
  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{.metadata.annotations.gitops_repo_url}}'
              revision: '{{.metadata.annotations.gitops_repo_revision}}'
              files:
                - path: 'platform/workloads/*/config.yaml'
          - clusters:
              selector:
                matchLabels:
                  '{{.enableLabel}}': "true"
  template:
    metadata:
      name: 'workload-{{.name}}-{{.path.basename}}'
    spec:
      project: default
      sources:
        # The chart. targetRevision is the CHART version, not a git ref.
        - repoURL: '{{.chart.repoURL}}'
          chart: '{{.chart.name}}'
          targetRevision: '{{.chart.version}}'
          helm:
            releaseName: '{{.chart.releaseName}}'
            # Base values, then an optional per-environment overlay. Later wins,
            # so the overlay holds only deltas and may not exist at all.
            valueFiles:
              - $values/platform/workloads/{{.path.basename}}/values.yaml
              - $values/{{.metadata.labels.environment}}/workloads/{{.path.basename}}/values.yaml
            ignoreMissingValueFiles: true
        # Exists only so $values above resolves into THIS repo rather than the
        # chart's registry.
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          ref: values
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
