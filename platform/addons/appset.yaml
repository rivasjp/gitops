apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rivasjp/gitops
              revision: main
              files:
                - path: 'platform/addons/*/config.yaml'
          - clusters:
              selector:
                matchLabels:
                  '{{.enableLabel}}': "true"
  template:
    metadata:
      name: 'addon-{{.name}}-{{.path.basename}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.chart.repoURL}}'
          chart: '{{.chart.name}}'
          targetRevision: '{{.chart.version}}'
          helm:
            releaseName: '{{.chart.releaseName}}'
            valueFiles:
              - $values/platform/addons/{{.path.basename}}/values.yaml
              - $values/environments/{{.metadata.labels.environment}}/addons/{{.path.basename}}/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          ref: values
        # Addon-owned CRs. The path is the addon directory, not manifests/,
        # which ArgoCD errors on when an addon does not have one.
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          path: 'platform/addons/{{.path.basename}}'
          directory:
            recurse: true
            include: 'manifests/*.yaml'
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Operator charts ship large CRDs. Client-side apply stores the whole
          # resource in the kubectl.kubernetes.io/last-applied-configuration
          # annotation, and annotations cap at 256KB — ARC's CRDs exceed it and
          # fail with "metadata.annotations: Too long". Server-side apply does
          # not write that annotation.
          - ServerSideApply=true
