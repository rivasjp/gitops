apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-bootstrap
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-bootstrap
  namespace: garage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["garage-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    # resourceNames doesn't restrict list/watch (collection-level requests), so
    # this is unscoped within the namespace; `kubectl wait` needs it to watch.
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["garage-0"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["garage-lgtm-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-bootstrap
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-bootstrap
subjects:
  - kind: ServiceAccount
    name: garage-bootstrap
    namespace: garage
