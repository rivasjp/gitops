apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ledger.postgresHost" . }}-init
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
data:
  01-roles.sh: |
    {{- .Files.Get "files/01-roles.sh" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ledger.postgresHost" . }}
  labels:
    {{- include "ledger.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ledger.componentLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ledger.postgresHost" . }}
  labels:
    {{- include "ledger.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "ledger.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledger.componentLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledger.componentLabels" (list . "postgres") | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: postgres:16.15
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: ledger
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- range list "POSTGRES_PASSWORD" "LEDGER_MIGRATOR_PASSWORD" "LEDGER_APP_PASSWORD" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}
                  key: {{ . }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, ledger]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ include "ledger.postgresHost" . }}-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
