apiVersion: batch/v1
kind: Job
metadata:
  # Named per image tag: runs once per release, and Argo prunes the previous one.
  name: {{ .Release.Name }}-migrate-{{ .Values.image.tag }}
  labels:
    {{- include "ledger.componentLabels" (list . "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Job specs are immutable; recreate instead of failing when the spec changes.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ledger.componentLabels" (list . "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        # distroless nonroot; must be numeric for the kubelet to verify it.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "ledger.image" . }}-migrate
          args: [up]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: GOOSE_DBSTRING
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
