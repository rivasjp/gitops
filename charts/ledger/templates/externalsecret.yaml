apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: {{ .Release.Name }}
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: {{`postgres://ledger_app:{{ .LEDGER_APP_PASSWORD }}@`}}{{ include "ledger.dbAddress" . }}
        GOOSE_DBSTRING: {{`postgres://ledger_migrator:{{ .LEDGER_MIGRATOR_PASSWORD }}@`}}{{ include "ledger.dbAddress" . }}
  dataFrom:
    - extract:
        key: ledger
