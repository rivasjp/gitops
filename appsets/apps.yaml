apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rivasjp/gitops
              revision: main
              directories:
                - path: 'environments/*/apps/*'
          - clusters:
              selector:
                matchLabels:
                  environment: '{{index .path.segments 1}}'
  template:
    metadata:
      name: 'app-{{.name}}-{{.path.basename}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          path: 'charts/{{.path.basename}}'
          helm:
            releaseName: '{{.path.basename}}'
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            ignoreMissingValueFiles: true
            parameters:
              # From the bridge, so the public repo never holds the account ID.
              - name: image.registry
                value: '{{.metadata.annotations.ecr_registry}}'
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          ref: values
      destination:
        name: '{{.name}}'
        namespace: fintech
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
