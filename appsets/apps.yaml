apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rivasjp/gitops
              revision: main
              directories:
                - path: 'environments/*/apps/*'
          - clusters:
              selector:
                matchLabels:
                  environment: '{{index .path.segments 1}}'
  template:
    metadata:
      name: 'app-{{.name}}-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: '{{.metadata.annotations.gitops_repo_url}}'
        targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
        path: '{{.path.path}}'
      destination:
        name: '{{.name}}'
        namespace: fintech
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
