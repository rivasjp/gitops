apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rivasjp/gitops
              revision: main
              files:
                - path: 'addons/*/addon.yaml'
          - clusters:
              selector:
                matchLabels:
                  '{{.enableLabel}}': "true"
  template:
    metadata:
      name: 'addon-{{.name}}-{{.path.basename}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.chart.repoURL}}'
          chart: '{{.chart.name}}'
          targetRevision: '{{.chart.version}}'
          helm:
            releaseName: '{{.chart.releaseName}}'
            valueFiles:
              - $values/addons/{{.path.basename}}/values.yaml
              - $values/environments/{{.metadata.labels.environment}}/addons/{{.path.basename}}/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          ref: values
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
