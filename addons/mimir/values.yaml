minio:
  enabled: false
kafka:
  enabled: false
ruler:
  enabled: false

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
querier:
  replicas: 1
query_scheduler:
  replicas: 1
store_gateway:
  zoneAwareReplication:
    enabled: false

global:
  extraEnvFrom:
    - secretRef:
        name: garage-mimir-credentials

mimir:
  structuredConfig:
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        replication_factor: 1
    limits:
      max_label_names_per_series: 50
    blocks_storage:
      s3:
        endpoint: garage.garage.svc.cluster.local:3900
        region: garage
        bucket_name: metrics
        access_key_id: ${GARAGE_ACCESS_KEY_ID}
        secret_access_key: ${GARAGE_SECRET_ACCESS_KEY}
        insecure: true
    alertmanager:
      data_dir: /data/alertmanager
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager-storage
