# Platform addons. One Application per (cluster x addon).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rivasjp/gitops
              revision: main
              files:
                - path: addons/*/config.yaml
          - clusters:
              selector:
                matchLabels:
                  enable_{{.path.basename}}: "true"
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.chart.repoURL}}'
          chart: '{{.chart.name}}'
          targetRevision: '{{.chart.version}}'
          helm:
            releaseName: '{{.chart.releaseName}}'
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: '{{.metadata.annotations.gitops_repo_url}}'
          targetRevision: '{{.metadata.annotations.gitops_repo_revision}}'
          ref: values
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
